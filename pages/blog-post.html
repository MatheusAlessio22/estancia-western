<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Analytics 4 + Meta Pixel (ver js/analytics.js) -->
  <script src="/js/analytics.js"></script>
  <title data-titulo-pagina>Blog — Estância Western</title>
  <meta name="description" data-descricao-pagina content="Dicas, guias e novidades sobre moda country da Estância Western.">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/logos/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/logos/favicon-64.png">
  <link rel="apple-touch-icon" href="/assets/logos/favicon-w-icone.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/blog.css">
  <script type="application/ld+json" data-schema-artigo>{}</script>
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a>

  <div id="site-header"></div>

  <main id="conteudo-principal">
    <article class="blog-post" data-blog-post hidden>
      <div class="blog-post__capa" data-blog-post-capa-container>
        <img data-blog-post-capa src="" alt="">
      </div>

      <div class="container blog-post__container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="/index.html">Home</a>
          <span aria-hidden="true">/</span>
          <a href="/blog">Blog</a>
          <span aria-hidden="true">/</span>
          <span aria-current="page" data-blog-post-titulo-breadcrumb>Artigo</span>
        </nav>

        <header class="blog-post__cabecalho">
          <span class="eyebrow" data-blog-post-categoria></span>
          <h1 data-blog-post-titulo></h1>
          <p class="blog-post__meta">
            Por <span data-blog-post-autor></span> · <time data-blog-post-data></time>
          </p>
        </header>

        <div class="blog-post__corpo" data-blog-post-corpo></div>
      </div>
    </article>

    <p data-blog-post-nao-encontrado hidden style="text-align:center;padding-block:var(--espaco-10);">
      Artigo não encontrado. <a href="/blog" style="text-decoration:underline;color:var(--cor-primaria);">Voltar para o blog</a>.
    </p>

    <section class="blog-post__sugestoes" data-blog-post-sugestoes-secao hidden>
      <div class="container">
        <div class="secao-cabecalho">
          <span class="eyebrow">Combine com o look</span>
          <h2>Produtos Para Você</h2>
        </div>
        <div class="carrossel-produtos" data-carrossel-produtos></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="/js/partials.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/carrinho-drawer.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/blog-post.js"></script>
  <script>injetarParciais('');</script>
</body>
</html>
