<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Carrinho — Estância Western</title>
  <meta name="description" content="Revise os itens do seu carrinho antes de finalizar a compra na Estância Western.">
  <link rel="icon" type="image/svg+xml" href="/assets/logos/favicon-placeholder.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a>

  <div id="site-header"></div>

  <main id="conteudo-principal">
    <div class="container">
      <div class="pagina-header">
        <h1>Meu Carrinho</h1>
      </div>

      <div class="carrinho-layout">
        <div>
          <div data-carrinho-lista></div>
          <div class="carrinho-vazio" data-carrinho-vazio hidden>
            <p style="margin-bottom:var(--espaco-5);">Seu carrinho está vazio.</p>
            <a href="/index.html" class="btn btn--primario">Continuar Comprando</a>
          </div>
        </div>

        <aside class="carrinho-resumo" data-carrinho-resumo>
          <h3>Resumo do Pedido</h3>

          <form class="cupom-form" data-cupom-form>
            <label for="cupom" class="sr-only">Código do cupom</label>
            <input type="text" id="cupom" name="cupom" class="cupom-form__input" placeholder="Código do cupom" autocomplete="off" data-cupom-input>
            <button type="submit" class="btn btn--secundario btn--pequeno" data-cupom-aplicar>Aplicar</button>
          </form>
          <p class="cupom-mensagem" data-cupom-mensagem role="alert" hidden></p>

          <div class="carrinho-resumo__linha">
            <span>Subtotal</span>
            <span data-resumo-subtotal>R$ 0,00</span>
          </div>
          <div class="carrinho-resumo__linha carrinho-resumo__linha--desconto" data-resumo-desconto-linha hidden>
            <span>Desconto</span>
            <span data-resumo-desconto>-R$ 0,00</span>
          </div>
          <div class="carrinho-resumo__linha">
            <span>Frete</span>
            <span data-resumo-frete>Grátis</span>
          </div>
          <div class="carrinho-resumo__linha total">
            <span>Total</span>
            <span data-resumo-total>R$ 0,00</span>
          </div>
          <p style="font-size:var(--texto-xs);color:var(--cor-primaria);margin-top:var(--espaco-2);" data-resumo-aviso-frete></p>
          <a href="/pages/checkout.html" class="btn btn--primario btn--bloco" style="margin-top:var(--espaco-4);">Finalizar Compra</a>
          <a href="/index.html" style="display:block;text-align:center;margin-top:var(--espaco-3);font-size:var(--texto-sm);text-decoration:underline;">Continuar comprando</a>
        </aside>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/partials.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/carrinho-drawer.js"></script>
  <script src="/js/main.js"></script>
  <script>injetarParciais('');</script>
</body>
</html>
